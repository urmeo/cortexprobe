[metadata]
name = cortexprobe
version = 0.2.0
description = Synthetic receptive field fitting and grouped validation
long_description = file: README.md
long_description_content_type = text/markdown
license_expression = MIT
license_files = LICENSE
author = urme
keywords = receptive-field, synthetic-data, grouped-validation, uncertainty
classifiers =
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3
    Topic :: Scientific/Engineering
project_urls =
    Repository = https://github.com/urmeo/cortexprobe
    Documentation = https://urmeo.github.io/cortexprobe/
    Issues = https://github.com/urmeo/cortexprobe/issues

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.9
setup_requires = setuptools>=77.0.3
install_requires =
    numpy>=1.24,<3
    scipy>=1.11,<2

[options.packages.find]
where = src

[options.extras_require]
viz = matplotlib>=3.7,<4
docs = Markdown>=3.7,<4
dev =
    pytest>=8.0,<9
    pytest-cov>=5.0,<7
    ruff>=0.6,<1
    mypy>=1.11,<2

[mypy]
files = src
strict = true
warn_unreachable = true
disallow_any_generics = false

[mypy-scipy.*]
ignore_missing_imports = true

[tool:pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    slow: runs hundreds of fits; deselect with -m 'not slow'

[coverage:run]
branch = true
source = src/cortexprobe

[coverage:report]
fail_under = 85
show_missing = true
