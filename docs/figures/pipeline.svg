<svg width="1600" height="1232" viewBox="0 0 1600 1232" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-description">
<title id="pipeline-title">CortexProbe signal flow</title>
<desc id="pipeline-description">Grouped aperture masks and synthetic responses form matched frames. Independent paths estimate a Gaussian field from all retained frames and validate training-fold models. Held-out masks enter fixed-parameter prediction; held-out responses enter scoring. Outputs include field parameters, in-sample fit checks, finite-fold R² summaries, and validation coverage.</desc>
<g id="cortexprobe-signal-flow">
<rect width="1600" height="1232" fill="#14191C"/>
<text id="Signal flow title" fill="#E7EDEF" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="36" font-weight="600" letter-spacing="0em"><tspan x="64" y="65.0909">CORTEXPROBE &#xb7; SIGNAL FLOW</tspan></text>
<text id="Core tools" fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" letter-spacing="0em"><tspan x="1271.18" y="66.7273">Python &#xb7; NumPy &#xb7; SciPy</tspan></text>
<text id="Pipeline description" fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" letter-spacing="0em"><tspan x="64" y="108.727">Build matched frames. Estimate a field. Test held-out groups.</tspan></text>
<rect id="Signal flow panel" x="32.75" y="136.75" width="1534.5" height="990.5" rx="9.25" fill="#1B2327" stroke="#34424A" stroke-width="1.5"/>
<g id="Build masks">
<rect x="65" y="165" width="430" height="194" rx="7" fill="#1B2327"/>
<rect x="65" y="165" width="430" height="194" rx="7" stroke="#788B95" stroke-width="2"/>
<text id="Build masks / title" fill="#E7EDEF" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="600" letter-spacing="0em"><tspan x="88" y="213.182">Build aperture masks</tspan></text>
<text id="Build masks / details" fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" letter-spacing="0em"><tspan x="88" y="254.727">Bar &#xb7; wedge &#xb7; ring&#10;</tspan><tspan x="88" y="286.727">Group return sweeps.&#10;</tspan><tspan x="88" y="318.727">Prune cross-group overlap.</tspan></text>
</g>
<g id="Synthetic responses">
<rect x="585" y="165" width="430" height="194" rx="7" fill="#1B2327"/>
<rect x="585" y="165" width="430" height="194" rx="7" stroke="#788B95" stroke-width="2"/>
<text id="Synthetic responses / title" fill="#E7EDEF" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="600" letter-spacing="0em"><tspan x="608" y="213.182">Create responses</tspan></text>
<text id="Synthetic responses / details" fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" letter-spacing="0em"><tspan x="608" y="254.727">Gaussian overlap&#10;</tspan><tspan x="608" y="286.727">&#xd7; amplitude + baseline&#10;</tspan><tspan x="608" y="318.727">+ optional seeded noise</tspan></text>
</g>
<g id="Aligned frames">
<rect x="1105" y="165" width="430" height="194" rx="7" fill="#1B2327"/>
<rect x="1105" y="165" width="430" height="194" rx="7" stroke="#55C4E0" stroke-width="2"/>
<text id="Aligned frames / title" fill="#E7EDEF" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="600" letter-spacing="0em"><tspan x="1128" y="213.182">Align frames</tspan></text>
<text id="Aligned frames / details" fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" letter-spacing="0em"><tspan x="1128" y="254.727">Mask + response + group&#10;</tspan><tspan x="1128" y="286.727">One row per retained frame</tspan></text>
</g>
<g id="All-frame fitting">
<rect x="65" y="445" width="670" height="206" rx="7" fill="#1B2327"/>
<rect x="65" y="445" width="670" height="206" rx="7" stroke="#55C4E0" stroke-width="2"/>
<text id="All-frame fitting / title" fill="#E7EDEF" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="600" letter-spacing="0em"><tspan x="88" y="493.182">Fit all retained frames</tspan></text>
<text id="All-frame fitting / details" fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" letter-spacing="0em"><tspan x="88" y="534.727">Candidate grid &#x2192; bounded refinement&#10;</tspan><tspan x="88" y="566.727">Amplitude + baseline at every geometry</tspan></text>
<text id="Refinement detail" fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" letter-spacing="0em"><tspan x="88" y="613">SciPy refines center + width.</tspan></text>
</g>
<g id="Field estimate">
<rect x="865" y="445" width="670" height="206" rx="7" fill="#1B2327"/>
<rect x="865" y="445" width="670" height="206" rx="7" stroke="#55C4E0" stroke-width="2"/>
<text id="Field estimate / title" fill="#E7EDEF" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="600" letter-spacing="0em"><tspan x="888" y="493.182">Field estimate + checks</tspan></text>
<text id="Field estimate / details" fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" letter-spacing="0em"><tspan x="888" y="534.727">Center &#xb7; width &#xb7; amplitude &#xb7; baseline&#10;</tspan><tspan x="888" y="566.727">In-sample R&#xb2; &#xb7; local uncertainty &#xb7; residual checks</tspan></text>
<rect id="Acceptance separator" x="888" y="582" width="624" height="1" fill="#34424A"/>
<text id="Acceptance rule" fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" letter-spacing="0em"><tspan x="888" y="613.5">Accept: converged &#xb7; R&#xb2; meets threshold&#10;</tspan><tspan x="888" y="640.5">positive amplitude &#xb7; sigma off its bounds</tspan></text>
</g>
<text id="Independent branch label" fill="#55C4E0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" letter-spacing="0em"><tspan x="448" y="705">Same inputs &#xb7; independent fits</tspan></text>
<text id="Group iteration label" fill="#55C4E0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" letter-spacing="0em"><tspan x="448" y="763">Repeat for each usable group</tspan></text>
<g id="Held-out group">
<rect x="65" y="785" width="318" height="222" rx="7" fill="#1B2327"/>
<rect x="65" y="785" width="318" height="222" rx="7" stroke="#F08B79" stroke-width="2"/>
<text id="Held-out group / title" fill="#E7EDEF" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="600" letter-spacing="0em"><tspan x="88" y="833.182">Hold out one group</tspan></text>
<text id="Held-out group / details" fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" letter-spacing="0em"><tspan x="88" y="874.727">Exclude one group.&#10;</tspan><tspan x="88" y="906.727">Fit the other groups.</tspan></text>
</g>
<g id="Training-only fitting">
<rect x="449" y="785" width="318" height="222" rx="7" fill="#1B2327"/>
<rect x="449" y="785" width="318" height="222" rx="7" stroke="#55C4E0" stroke-width="2"/>
<text id="Training-only fitting / title" fill="#E7EDEF" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="600" letter-spacing="0em"><tspan x="472" y="832.455">Fit training frames</tspan></text>
<text id="Training-only fitting / details" fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" letter-spacing="0em"><tspan x="472" y="874.727">Candidate grid &#x2192;&#10;</tspan><tspan x="472" y="906.727">bounded refinement&#10;</tspan><tspan x="472" y="938.727">Solve amplitude +&#10;</tspan><tspan x="472" y="970.727">baseline at each trial</tspan></text>
</g>
<g id="Fixed-parameter prediction">
<rect x="833" y="785" width="318" height="222" rx="7" fill="#1B2327"/>
<rect x="833" y="785" width="318" height="222" rx="7" stroke="#55C4E0" stroke-width="2"/>
<text id="Fixed-parameter prediction / title" fill="#E7EDEF" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="600" letter-spacing="0em"><tspan x="856" y="833.182">Predict held-out</tspan></text>
<text id="Fixed-parameter prediction / details" fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" letter-spacing="0em"><tspan x="856" y="874.727">Freeze all five&#10;</tspan><tspan x="856" y="906.727">parameters.&#10;</tspan><tspan x="856" y="938.727">Use held-out masks.&#10;</tspan><tspan x="856" y="970.727">Predict their responses.</tspan></text>
</g>
<g id="Held-out scoring">
<rect x="1217" y="785" width="318" height="222" rx="7" fill="#1B2327"/>
<rect x="1217" y="785" width="318" height="222" rx="7" stroke="#55C4E0" stroke-width="2"/>
<text id="Held-out scoring / title" fill="#E7EDEF" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="600" letter-spacing="0em"><tspan x="1240" y="832.455">Validation summary</tspan></text>
<text id="Held-out scoring / details" fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" letter-spacing="0em"><tspan x="1240" y="874.727">Finite fold R&#xb2;:&#10;</tspan><tspan x="1240" y="906.727">mean + sample SD&#10;</tspan><tspan x="1240" y="938.727">Valid / requested folds&#10;</tspan><tspan x="1240" y="970.727">Complete / incomplete</tspan></text>
</g>
<text id="Acceptance and validation" fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" letter-spacing="0em"><tspan x="64" y="1175">Held-out scores do not decide acceptance.</tspan></text>
<text id="Scope" fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" letter-spacing="0em"><tspan x="64" y="1211">Examples and recorded results are synthetic. No human-data or neural-network evaluation.</tspan></text>
