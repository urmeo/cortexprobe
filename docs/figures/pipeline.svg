<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title description">
  <title id="title">CortexProbe: fit a field and test its predictions</title>
  <desc id="description">Matched aperture masks, responses, and group labels branch into two independent paths. A full-data fit estimates the field. Separate training-fold fits predict excluded groups with all five parameters fixed. Both paths search candidate centers and widths, refine the geometry within bounds, and solve amplitude and baseline at every geometry. Acceptance uses in-sample checks. Examples and recorded results are synthetic.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #e7edef; }
      .title { font-size: 40px; font-weight: 700; }
      .heading { font-size: 27px; font-weight: 700; }
      .body { font-size: 23px; }
      .small { font-size: 21px; }
      .label { font-size: 19px; font-weight: 700; letter-spacing: 1px; }
      .muted { fill: #afbec6; }
      .cyan { fill: #54c6e5; }
      .mint { fill: #84d6b7; }
      .panel { fill: #1b2429; stroke: #526570; stroke-width: 2; }
      .connector { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
    </style>
    <marker id="arrow-input" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#afbec6" />
    </marker>
    <marker id="arrow-estimate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#54c6e5" />
    </marker>
    <marker id="arrow-validation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#84d6b7" />
    </marker>
    <clipPath id="bar-mask"><circle cx="88" cy="312" r="27" /></clipPath>
  </defs>

  <rect width="1440" height="1060" fill="#141a1e" />
  <text x="36" y="40" class="label muted">CORTEXPROBE / PIPELINE</text>
  <text x="36" y="93" class="title">Fit a field. Test its predictions.</text>
  <text x="36" y="133" class="body muted">Matched frames → separate fits → field estimate and held-out scores</text>
  <path d="M36 155H1404" stroke="#526570" />

  <text x="36" y="194" class="label muted">01 MATCH INPUTS</text>
  <text x="440" y="194" class="label muted">02 FIT SEPARATE MODELS</text>
  <text x="956" y="194" class="label muted">03 INSPECT OUTPUTS</text>

  <g aria-label="Matched inputs">
    <rect x="36" y="214" width="300" height="416" rx="10" class="panel" />
    <text x="60" y="257" class="heading">Matched frame data</text>
    <g aria-label="Schematic bar, wedge, and ring aperture masks">
      <circle cx="88" cy="312" r="27" fill="#2c3b43" />
      <path d="M60 306H116V318H60Z" fill="#54c6e5" clip-path="url(#bar-mask)" />
      <circle cx="186" cy="312" r="27" fill="#2c3b43" />
      <path d="M186 312V285A27 27 0 0 1 205.1 292.9Z" fill="#54c6e5" />
      <circle cx="284" cy="312" r="27" fill="#2c3b43" />
      <circle cx="284" cy="312" r="17" fill="none" stroke="#54c6e5" stroke-width="7" />
      <text x="88" y="369" class="small muted" text-anchor="middle">bar</text>
      <text x="186" y="369" class="small muted" text-anchor="middle">wedge</text>
      <text x="284" y="369" class="small muted" text-anchor="middle">ring</text>
    </g>
    <path d="M60 393H312" stroke="#526570" />
    <text x="60" y="431" class="body">Aperture masks</text>
    <text x="60" y="462" class="small muted">One per retained frame</text>
    <text x="60" y="506" class="body">Frame responses</text>
    <text x="60" y="537" class="small muted">One per retained frame</text>
    <text x="60" y="581" class="body">Group labels</text>
    <text x="60" y="612" class="small muted">Hold out complete groups</text>
  </g>

  <path d="M336 422H380M380 300V544" class="connector" stroke="#afbec6" />
  <path d="M380 300H428" class="connector" stroke="#afbec6" marker-end="url(#arrow-input)" />
  <path d="M380 544H428" class="connector" stroke="#afbec6" marker-end="url(#arrow-input)" />

  <g aria-label="Full-data estimation">
    <rect x="440" y="214" width="420" height="172" rx="10" fill="#1b2429" stroke="#54c6e5" stroke-width="2" />
    <text x="464" y="260" class="heading cyan">Full-data fit</text>
    <text x="464" y="304" class="body">Fit all retained frames.</text>
    <text x="464" y="346" class="small muted">One model estimates the field.</text>
    <path d="M860 300H944" class="connector" stroke="#54c6e5" marker-end="url(#arrow-estimate)" />
    <rect x="956" y="214" width="448" height="172" rx="10" class="panel" />
    <text x="980" y="260" class="heading cyan">Field estimate</text>
    <text x="980" y="304" class="body">Center · width · amplitude · baseline</text>
    <text x="980" y="346" class="small muted">In-sample R² · acceptance · diagnostics</text>
  </g>

  <text x="440" y="427" class="small muted">The full-data fit does not initialize the fold models.</text>

  <g aria-label="Independent grouped validation">
    <rect x="440" y="458" width="420" height="172" rx="10" fill="#1b2429" stroke="#84d6b7" stroke-width="2" />
    <text x="464" y="504" class="heading mint">Training-fold refits</text>
    <text x="464" y="548" class="body">Hold out one group; fit the rest.</text>
    <text x="464" y="590" class="small muted">Repeat for each usable fold.</text>
    <path d="M860 544H944" class="connector" stroke="#84d6b7" marker-end="url(#arrow-validation)" />
    <rect x="956" y="458" width="448" height="172" rx="10" class="panel" />
    <text x="980" y="504" class="heading mint">Held-out prediction</text>
    <text x="980" y="544" class="body">Freeze all five parameters → predict.</text>
    <text x="980" y="582" class="small muted">Mean of finite fold R² + sample SD</text>
    <text x="980" y="612" class="small muted">Score against excluded responses.</text>
  </g>

  <text x="36" y="674" class="small muted">Within each fold, held-out responses are used only to score predictions.</text>

  <g aria-label="Fitting algorithm run independently for every model">
    <rect x="36" y="708" width="1368" height="188" rx="10" class="panel" />
    <text x="60" y="746" class="label muted">INSIDE EACH FIT · RUN INDEPENDENTLY</text>
    <text x="60" y="791" class="heading">Candidate grid</text>
    <text x="60" y="826" class="body muted">Search center + width</text>
    <path d="M500 797H644" class="connector" stroke="#afbec6" marker-end="url(#arrow-input)" />
    <text x="692" y="791" class="heading">Bounded geometry refinement</text>
    <text x="692" y="826" class="body muted">Refine x0, y0, σ with SciPy</text>
    <text x="60" y="871" class="body">At every geometry: solve amplitude + baseline by linear least squares.</text>
  </g>

  <text x="36" y="941" class="label muted">IN-SAMPLE ACCEPTANCE</text>
  <text x="36" y="976" class="small">Converged · R² meets threshold · positive amplitude · σ away from bounds</text>
  <text x="36" y="1006" class="small muted">Held-out scores do not decide acceptance.</text>
  <text x="36" y="1040" class="small muted">Examples and recorded results use synthetic responses. No human-data or neural-network evaluation.</text>
</svg>
