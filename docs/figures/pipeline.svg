<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" role="img" aria-labelledby="title description">
  <title id="title">CortexProbe pipeline: matched frames to field estimates and held-out scores</title>
  <desc id="description">Build and prune aperture masks, create aligned synthetic responses, and validate inputs. Matched data branch into independent full-data estimation and grouped validation. The full-data path searches candidate centers and widths, refines geometry within bounds, and reports field parameters and in-sample checks. Each validation fold excludes one complete group, independently fits the remaining groups, freezes all five parameters, predicts the excluded masks, and scores against excluded responses. Both fitting paths solve amplitude and baseline at every geometry. Excluded masks bypass training to enter prediction; excluded responses bypass training and prediction to enter scoring only.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #e7eded; }
      .title { font-size: 32px; font-weight: 700; }
      .heading { font-size: 24px; font-weight: 700; }
      .compact-heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 18.5px; }
      .label { font-size: 20px; font-weight: 700; }
      .muted { fill: #a8b5bd; }
      .cyan { fill: #55c4e0; }
      .excluded { fill: #f08b79; }
      .card { fill: #1b2327; stroke: #cad4d9; stroke-width: 2; }
      .fit { stroke: #55c4e0; }
      .flow { fill: none; stroke: #55c4e0; stroke-width: 2; stroke-linejoin: round; }
      .bypass { fill: none; stroke: #f08b79; stroke-width: 2; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#55c4e0" />
    </marker>
    <marker id="excluded-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#f08b79" />
    </marker>
  </defs>

  <rect width="1280" height="1160" fill="#14191c" />
  <text x="48" y="66" class="title">CORTEXPROBE PIPELINE</text>
  <text x="48" y="102" class="body muted">Aperture masks → field estimates and held-out scores</text>
  <path d="M48 122H1232" stroke="#a8b5bd" stroke-width="2" />
  <rect x="24" y="144" width="1232" height="900" rx="8" fill="#1b2327" stroke="#303b41" stroke-width="1.5" />

  <text x="48" y="184" class="label">PREPARE SYNTHETIC INPUTS</text>
  <g aria-label="Build aperture masks">
    <rect x="48" y="206" width="248" height="148" rx="8" class="card" />
    <text x="72" y="246" class="heading">Build apertures</text>
    <text x="72" y="282" class="body muted">Bar · wedge · ring</text>
    <text x="72" y="312" class="body muted">Group frames; prune</text>
    <text x="72" y="340" class="body muted">cross-group overlap</text>
  </g>
  <path d="M298 280H336" class="flow" marker-end="url(#arrow)" />
  <g aria-label="Create responses from retained masks">
    <rect x="344" y="206" width="280" height="148" rx="8" class="card" />
    <text x="368" y="246" class="heading">Create responses</text>
    <text x="368" y="282" class="body muted">Gaussian–mask overlap</text>
    <text x="368" y="312" class="body muted">× amplitude + baseline</text>
    <text x="368" y="340" class="body muted">Optional seeded noise</text>
  </g>
  <path d="M626 280H672" class="flow" marker-end="url(#arrow)" />
  <g aria-label="Align and validate inputs">
    <rect x="680" y="206" width="552" height="148" rx="8" class="card fit" />
    <text x="704" y="246" class="heading">Align inputs</text>
    <text x="704" y="286" class="body muted">One mask, response + group per retained frame</text>
    <text x="704" y="324" class="body muted">Check shapes, values + fit bounds</text>
  </g>

  <path d="M956 354V386H36V853" class="flow" />
  <path d="M36 532H40" class="flow" marker-end="url(#arrow)" />
  <path d="M36 853H40" class="flow" marker-end="url(#arrow)" />
  <text x="48" y="377" class="small cyan">same matched inputs · independent fits</text>

  <text x="48" y="432" class="label">ESTIMATE THE FIELD · ALL RETAINED FRAMES</text>
  <g aria-label="Search candidate field geometries">
    <rect x="48" y="450" width="248" height="164" rx="8" class="card fit" />
    <text x="72" y="490" class="heading">Candidate grid</text>
    <text x="72" y="532" class="body muted">Center + width search</text>
    <text x="72" y="567" class="body muted">Best in-sample R²</text>
  </g>
  <path d="M298 532H336" class="flow" marker-end="url(#arrow)" />
  <g aria-label="Refine the full-data field geometry">
    <rect x="344" y="450" width="280" height="164" rx="8" class="card fit" />
    <text x="368" y="490" class="heading">Refine geometry</text>
    <text x="368" y="532" class="body muted">Bounded x0, y0, σ</text>
    <text x="368" y="567" class="body muted">SciPy least squares</text>
  </g>
  <path d="M626 532H672" class="flow" marker-end="url(#arrow)" />
  <g aria-label="Read the full-data field and diagnostics">
    <rect x="680" y="450" width="552" height="164" rx="8" class="card" />
    <text x="704" y="490" class="heading">Field estimate + checks</text>
    <text x="704" y="532" class="body muted">Center · width · amplitude · baseline</text>
    <text x="704" y="567" class="body muted">In-sample R² · acceptance · diagnostics</text>
    <text x="704" y="598" class="small muted">Local geometry uncertainty + residual structure</text>
  </g>
  <text x="48" y="650" class="body muted">At every candidate and refinement step: solve amplitude + baseline by linear least squares.</text>

  <text x="48" y="695" class="label">TEST EXCLUDED GROUPS · REPEAT FOR EACH USABLE GROUP</text>
  <path d="M172 760V732H804V752" class="bypass" marker-end="url(#excluded-arrow)" />
  <text x="368" y="721" class="small excluded">held-out masks → prediction only</text>

  <g aria-label="Exclude one complete group">
    <rect x="48" y="760" width="248" height="186" rx="8" class="card" />
    <text x="72" y="800" class="compact-heading">Hold out one group</text>
    <text x="72" y="845" class="body muted">Train on all</text>
    <text x="72" y="876" class="body muted">other groups.</text>
    <text x="72" y="920" class="small muted">Keep test data separate.</text>
  </g>
  <path d="M298 853H336" class="flow" marker-end="url(#arrow)" />
  <g aria-label="Independently fit the training frames">
    <rect x="344" y="760" width="280" height="186" rx="8" class="card fit" />
    <text x="368" y="800" class="heading">Fit training groups</text>
    <text x="368" y="838" class="body muted">Grid search</text>
    <text x="368" y="867" class="body muted">→ bounded refinement</text>
    <text x="368" y="903" class="small muted">Solve amplitude + baseline</text>
    <text x="368" y="930" class="small muted">at every geometry.</text>
  </g>
  <path d="M626 853H672" class="flow" marker-end="url(#arrow)" />
  <g aria-label="Predict excluded frames with fixed fitted parameters">
    <rect x="680" y="760" width="248" height="186" rx="8" class="card" />
    <text x="704" y="800" class="compact-heading">Predict held-out</text>
    <text x="704" y="845" class="body muted">Freeze all five</text>
    <text x="704" y="876" class="body muted">parameters.</text>
    <text x="704" y="920" class="small muted">Use excluded masks.</text>
  </g>
  <path d="M930 853H976" class="flow" marker-end="url(#arrow)" />
  <g aria-label="Score held-out predictions against held-out responses">
    <rect x="984" y="760" width="248" height="186" rx="8" class="card" />
    <text x="1008" y="800" class="compact-heading">Score predictions</text>
    <text x="1008" y="845" class="body muted">Fold R²</text>
    <text x="1008" y="882" class="small muted">Finite-fold mean</text>
    <text x="1008" y="915" class="small muted">+ sample SD</text>
  </g>
  <path d="M172 946V984H1108V954" class="bypass" marker-end="url(#excluded-arrow)" />
  <text x="368" y="1013" class="body excluded">held-out responses → scoring only</text>

  <text x="48" y="1080" class="small muted">The full-data fit does not initialize the fold models.</text>
  <text x="48" y="1110" class="small muted">Acceptance uses in-sample checks; held-out scores do not gate it.</text>
  <text x="48" y="1140" class="small muted">Examples and recorded results are synthetic. No human-data or neural-network evaluation.</text>
</svg>
