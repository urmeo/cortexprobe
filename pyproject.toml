[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexprobe"
version = "0.2.0"
description = "Synthetic receptive field fitting and grouped validation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "urme" }]
keywords = ["receptive-field", "synthetic-data", "grouped-validation", "uncertainty"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.11,<2",
]

[project.urls]
Repository = "https://github.com/urmeo/cortexprobe"
Documentation = "https://urmeo.github.io/cortexprobe/"
Issues = "https://github.com/urmeo/cortexprobe/issues"

[project.optional-dependencies]
viz = ["matplotlib>=3.7,<4"]
docs = ["Markdown>=3.7,<4"]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "C4", "PT"]
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
"src/cortexprobe/config.py" = ["UP007", "UP045"]
"scripts/*" = ["RUF001"]

[tool.mypy]
files = ["src"]
strict = true
warn_unreachable = true
disallow_any_generics = false
plugins = []

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: runs hundreds of fits; deselect with -m 'not slow'",
]

[tool.coverage.run]
branch = true
source = ["src/cortexprobe"]

[tool.coverage.report]
fail_under = 85
show_missing = true
